[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixa-lang"
version = "0.1.0"
description = "PIXA — a forensic scripting language and analysis console for computer and network investigation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["dfir", "forensics", "incident-response", "dsl", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# No runtime dependencies. The language, runtime, CLI, console server and
# tests all run on the standard library alone.
dependencies = []

[project.scripts]
pixa = "pixa.cli:main"

[tool.setuptools]
packages = ["pixa"]

[tool.setuptools.package-data]
pixa = ["../console/index.html"]
